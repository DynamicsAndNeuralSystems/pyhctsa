medical:

  hrv_classic:
    base_name: hrv_classic
    dependencies:
    configs:
      - {zscore: True}
    legacy_name: MD_hrv_classic

spectral:
  spectral_summaries:
    base_name: spectral_summaries
    depedencies:
    configs:
      - {psd_meth: 'welch', window_type: 'rect', zscore: True}
      - {psd_meth: 'fft', window_type: 'none', zscore: True}
    legacy_name: SP_Summaries
    ordered_args: ['psd_meth', 'window_type']

correlation:

  autocorr:
    base_name: ac
    dependencies:
    configs:
      - {tau: !range [1, 40], zscore: True}
    legacy_name: CO_AutoCorr
    ordered_args: ['tau']
  
  nonlinear_autocorr:
    base_name: ac_nl
