name: Build Wheels

on: 
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false 
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3
        env:
          CIBW_ARCHS: "auto64"
          CIBW_SKIP: "pp*"
          CIBW_BUILD_VERBOSITY: "1"

      - name: Upload individual job wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        run: pipx run build --sdist
      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  merge_artifacts:
    name: Merge all distributions
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Final Artifact Upload
        uses: actions/upload-artifact@v4
        with:
          name: all-dist-files
          path: dist/
  
  publish_pypi:
    name: Publish to PyPI
    needs: [merge_artifacts]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')  # publish only on version tags
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # required for PyPI trusted publishing (OIDC)
      contents: read
    steps:
      - name: Download merged dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: all-dist-files
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          