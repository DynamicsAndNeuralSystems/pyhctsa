name: Cross-platform consistency

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# a new push to a branch (or PR) cancels its run still in progress
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-per-os:
    name: Run (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # main: every OS x every Python; pull requests: every OS on one Python
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.12"]' || '["3.10", "3.11", "3.12", "3.13", "3.14"]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run extractor
        run: |
          python .github/workflows/ci/compute_features.py

      - name: Upload artifact (pickle + meta)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}-py${{ matrix.python-version }}
          path: ci_out/

  compare:
    name: Compare results
    needs: run-per-os
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install compare deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Compare pickles (soft)
        env:
          SOFT_COMPARE: "1"
        run: python .github/workflows/ci/compare_pickles.py
