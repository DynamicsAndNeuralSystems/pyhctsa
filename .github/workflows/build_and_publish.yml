name: Build & Publish (manual)

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish"
        type: choice
        required: true
        default: testpypi
        options:
          - testpypi
          - pypi

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, ubuntu-24.04-arm, windows-latest]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_ARCHS: "auto64"
          # no free-threaded builds; no 3.15 until CI tests it; no musllinux: numba (llvmlite) and
          # scikit-learn publish no musllinux wheels, so a musllinux wheel could not be installed
          CIBW_SKIP: "cp3??t-* cp315-* *-musllinux_*"
          # install each wheel in a fresh environment and run the default feature set on one series
          CIBW_TEST_COMMAND: "python {project}/.github/workflows/ci/wheel_smoke_test.py"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux_2_28"
          CIBW_MANYLINUX_AARCH64_IMAGE: "manylinux_2_28"

      - name: Upload individual job wheels
        uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  merge_artifacts:
    name: Merge all distributions
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - name: Final Artifact Upload
        uses: actions/upload-artifact@v4
        with:
          name: all-dist-files
          path: dist/

  publish:
    name: Publish
    needs: [merge_artifacts]
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: all-dist-files
          path: dist

      # A release to PyPI is made from its tag: run the workflow on the tag v<version>
      # (Actions > Build & Publish > Run workflow > Use workflow from: Tags)
      - name: Require the release tag for PyPI
        if: inputs.target == 'pypi'
        run: |
          sdist=$(ls dist/pyhctsa-*.tar.gz)
          version=$(basename "$sdist" .tar.gz); version=${version#pyhctsa-}
          echo "Built version: $version; running on $GITHUB_REF_TYPE '$GITHUB_REF_NAME'"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Publishing pyhctsa $version to PyPI must run on the tag v$version"
            exit 1
          fi

      - name: Publish to TestPyPI
        if: inputs.target == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true   # (a dry run can be repeated for the same version)

      - name: Publish to PyPI
        if: inputs.target == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          
