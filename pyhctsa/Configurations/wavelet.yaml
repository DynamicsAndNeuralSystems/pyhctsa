Wavelet:
  WLCoeffs:
    base_name: WL_coeffs
    labels:
      - wavelet
    dependencies:
      - pywt
      - PyWavelets
    configs:
      - wname: 'db3'
        level:  [1, 2, 3, 4, 5, 'max']
        zscore: True
    hctsa_name: WL_coeffs
    ordered_args: ["wname", "level"]
  
  DetailCoeffs:
    base_name: DetailCoeffs
    labels:
      - wavelet
    dependencies:
      - pywt
      - PyWavelets
    configs:
      - wname: 'db3'
        maxlevel: 'max'
        zscore: True
    hctsa_name: WL_DetailCoeffs
    ordered_args: ["wname", "maxlevel"]
  
  CWT:
    base_name: cwt
    labels:
      - wavelet
    dependencies:
      - pywt
      - PyWavelets
    configs:
      - wname: ['db3', 'sym2']
        maxScale: 32
        zscore: True
    hctsa_name: WL_cwt
    ordered_args: ["wname", "maxScale"]
  
  dwtCoeff:
    base_name: dwtcoeff
    labels:
      - wavelet
    dependencies:
      - pywt
      - PyWavelets
    configs:
      - wname: ['db3', 'sym2']
        level: 5
        zscore: True
    hctsa_name: WL_dwtcoeff
    ordered_args: ["wname", "level"]
  
  scal2Frq:
    base_name: scal2frq
    labels: 
      - wavelet
    depedencies:
      - pywt
      - PyWavelets
    configs:
      - wname: 'db3'
        amax: 'max'
        delta: 1
        zscore: True
    hctsa_name: WL_scal2frq
    ordered_args: ["wname", "amax", "delta"]
  
  wfBM_estimate:
    base_name: fBM
    labels:
      - wavelet
    depedencies:
      - pywt
      - PyWavelets
    configs:
      - zscore: True
    hctsa_name: WL_fBM
    ordered_args: 
    