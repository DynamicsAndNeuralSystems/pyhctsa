      - {what_type: 'len', extra_param: 150, zscore: True}
      - {what_type: 'len', extra_param: 200, zscore: True}
      - {what_type: 'len', extra_param: 250, zscore: True}
      - {what_type: 'len', extra_param: 500, zscore: True}
      - {what_type: 'len', extra_param: 1000, zscore: True}
    legacy_name: SY_StatAv
    ordered_args: ['what_type', 'extra_param']

  trend:
    base_name: trend
    dependencies:
    configs:
