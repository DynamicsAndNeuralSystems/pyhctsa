information:
  automutual_info_stats:
    base_name: automutual_info_stats
    dependencies:
      - jpype1
    configs:
      - {max_tau: 40, est_method: 'gaussian', zscore: True}
      - {max_tau: 20, est_method: 'gaussian', zscore: True}
      - {max_tau: 40, est_method: 'kraskov1', extra_param: '4', zscore: True}
      - {max_tau: 20, est_method: 'kraskov1', extra_param: '4', zscore: True}
    legacy_name: IN_AutoMutualInfoStats
    ordered_args: ['max_tau', 'est_method', 'extra_param']

  first_min:
    base_name: first_min
    dependencies:
      - jpype1
    configs:
      - {min_what: 'ac', zscore: True}
      - {min_what: 'mi-gaussian', zscore: True}
      - {min_what: 'mi-kraskov2', extra_param: '4', zscore: True}
      - {min_what: 'mi-hist', extra_param: '5', zscore: True}
      - {min_what: 'mi-hist', extra_param: '10', zscore: True}
      - {min_what: 'ac', min_not_max: False, zscore: True}
      - {min_what: 'mi-gaussian', min_not_max: False, zscore: True}
      - {min_what: 'mi-kraskov2', extra_param: '4', min_not_max: False, zscore: True}
      - {min_what: 'mi-hist', extra_param: '5', min_not_max: False, zscore: True}
      - {min_what: 'mi-hist', extra_param: '10', min_not_max: False, zscore: True}
    legacy_name: CO_FirstMin
    ordered_args: ['min_what', 'extra_param', 'min_not_max']
  
  rm_automutual_information:
    base_name: rm_automutual_information
    dependencies:
    configs:
      - {tau: 0, zscore: True}
      - {tau: 1, zscore: True}
      - {tau: 2, zscore: True}
      - {tau: 3, zscore: True}
      - {tau: 4, zscore: True}
      - {tau: 5, zscore: True}
      - {tau: 6, zscore: True}
      - {tau: 7, zscore: True}
      - {tau: 8, zscore: True}
      - {tau: 9, zscore: True}
      - {tau: 10, zscore: True}
    legacy_name: CO_RM_AMInformation
    ordered_args: ['tau']
 