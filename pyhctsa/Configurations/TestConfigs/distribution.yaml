Distribution:
  withinp:
    base_name: withinp
    dependencies:
    configs:
      - {p: 0.5, mean_or_median: 'mean', zscore: True}
      - {p: 0.5, mean_or_median: 'median', zscore: True}
      - {p: 1.0, mean_or_median: 'mean', zscore: True}
      - {p: 1.0, mean_or_median: 'median', zscore: True}
      - {p: 1.5, mean_or_median: 'mean', zscore: True}
      - {p: 1.5, mean_or_median: 'median', zscore: True}
      - {p: 2.0, mean_or_median: 'mean', zscore: True}
      - {p: 2.0, mean_or_median: 'median', zscore: True}
      - {p: 2.5, mean_or_median: 'mean', zscore: True}
      - {p: 2.5, mean_or_median: 'median', zscore: True}
      - {p: 3.0, mean_or_median: 'mean', zscore: True}
      - {p: 3.0, mean_or_median: 'median', zscore: True}
    legacy_name: DN_Withinp
    ordered_args: ['p', 'mean_or_median']

  unique:
    base_name: unique
    dependencies:
    configs:
      - {zscore: False}
    legacy_name: DN_Unique
    ordered_args:
  
  spread:
    base_name: spread
    dependencies:
    configs:
      - {spread_measure: 'std', zscore: False}
      - {spread_measure: 'mad', zscore: False}
      - {spread_measure: 'iqr', zscore: False}
      - {spread_measure: 'mead', zscore: False}
    legacy_name: DN_Spread
    ordered_args: ['spread_measure']

  quantile:
    base_name: quantile
    dependencies:
    configs:
      - {p: 0.01, zscore: True}
      - {p: 0.02, zscore: True}
      - {p: 0.03, zscore: True}
      - {p: 0.04, zscore: True}
      - {p: 0.05, zscore: True}
      - {p: 0.1, zscore: True}
      - {p: 0.2, zscore: True}
      - {p: 0.3, zscore: True}
      - {p: 0.4, zscore: True}
      - {p: 0.5, zscore: True}
      - {p: 0.6, zscore: True}
      - {p: 0.7, zscore: True}
      - {p: 0.8, zscore: True}
      - {p: 0.9, zscore: True}
      - {p: 0.91, zscore: True}
      - {p: 0.92, zscore: True}
      - {p: 0.93, zscore: True}
      - {p: 0.94, zscore: True}
      - {p: 0.95, zscore: True}
      - {p: 0.96, zscore: True}
      - {p: 0.97, zscore: True}
      - {p: 0.98, zscore: True}
      - {p: 0.99, zscore: True}
    legacy_name: DN_Quantile
    ordered_args: ['p']

  proportion_values:
    base_name: proportion_values
    dependencies:
    configs:
      - {prop_what: 'zeros', zscore: False}
      - {prop_what: 'positive', zscore: False}
      - {prop_what: 'geq0', zscore: False}
    legacy_name: DN_ProportionValues
    ordered_args: ['prop_what']

  pleft:
    base_name: pleft
    dependencies:
    configs:
      - {th: 0.05, zscore: True}
      - {th: 0.1, zscore: True}
      - {th: 0.2, zscore: True}
      - {th: 0.3, zscore: True}
      - {th: 0.4, zscore: True}
      - {th: 0.5, zscore: True}
    legacy_name: DN_pleft
    ordered_args: ['th']

  min_max:
    base_name: min_max
    dependencies:
    configs:
      - {min_or_max: 'max', zscore: True}
      - {min_or_max: 'min', zscore: True}
    legacy_name: DN_MinMax
    ordered_args: ['min_or_max']
  
  mean:
    base_name: mean
    dependencies:
    configs:
      - {mean_type: 'norm', zscore: False}
      - {mean_type: 'harm', zscore: False}
      - {mean_type: 'rms', zscore: False}
      - {mean_type: 'median', zscore: False}
      - {mean_type: 'midhinge', zscore: False}
    legacy_name: DN_Mean
    ordered_args: ['mean_type']
  
  high_low_mu:
    base_name: high_low_mu
    dependencies:
    configs:
      - {zscore: False}
    legacy_name: DN_HighLowMu
    ordered_args:

  fit_mle:
    base_name: fit_mle
    dependencies:
    configs:
      - {fit_what: 'geometric', zscore: False}
    legacy_name: DN_Fit_mle
    ordered_args: ['fit_what']

  cv:
    base_name: cv
    dependencies:
    configs:
      - {k: 1, zscore: False}
      - {k: 2, zscore: False}
    legacy_name: DN_cv
    ordered_args: ['k']

  custom_skewness:
    base_name: custom_skewness
    dependencies:
    configs:
      - {what_skew: 'pearson', zscore: False}
      - {what_skew: 'bowley', zscore: True}
    legacy_name: DN_CustomSkewness
    ordered_args: ['what_skew']
  
  burstiness:
    base_name: burstiness
    dependencies:
    configs:
      - {zscore: False}
    legacy_name: DN_Burstiness
    ordered_args: 
  
  moments:
    base_name: moments
    dependencies:
    configs:
      - {the_mom: 3, zscore: True}
      - {the_mom: 4, zscore: True}
      - {the_mom: 5, zscore: True}
      - {the_mom: 6, zscore: True}
      - {the_mom: 7, zscore: True}
      - {the_mom: 8, zscore: True}
      - {the_mom: 9, zscore: True}
      - {the_mom: 10, zscore: True}
      - {the_mom: 11, zscore: True}
      
      - {the_mom: 3, zscore: False}
      - {the_mom: 4, zscore: False}
      - {the_mom: 5, zscore: False}
      - {the_mom: 6, zscore: False}
      - {the_mom: 7, zscore: False}
      - {the_mom: 8, zscore: False}
      - {the_mom: 9, zscore: False}
      - {the_mom: 10, zscore: False}
      - {the_mom: 11, zscore: False}
    legacy_name: DN_Moments
    ordered_args: ['the_mom']

  outlier_include:
    base_name: outlier_include
    dependencies:
    configs:
      - {threshold_how: 'abs', inc: 0.01, zscore: True}
      - {threshold_how: 'pos', inc: 0.01, zscore: True}
      - {threshold_how: 'neg', inc: 0.01, zscore: True}
    legacy_name: DN_OutlierInclude
    ordered_args: ['threshold_how', 'inc']

  outlier_test:
    base_name: outlier_test
    dependencies:
    configs:
      - {p: 2, zscore: True}
      - {p: 5, zscore: True}
      - {p: 10, zscore: True}
    legacy_name: DN_OutlierTest
    ordered_args: ['p']

  # TrimmedMean:
  #   base_name: TrimmedMean
  #   labels:
  #     - distribution
  #     - location
  #     - raw
  #     - locationDependent
  #   dependencies:
  #   configs:
  #     - pExclude: [1, 5, 10, 25, 50]
  #   hctsa_name: DN_TrimmedMean
  #   ordered_args: ["pExclude"]
  
  histogram_asymmetry:
    base_name: histogram_asymmetry
    dependencies:
    configs:
      - {num_bins: 11, do_simple: False, zscore: True}
    legacy_name: DN_HistogramAsymmetry
    ordered_args: ['num_bins']
  
  histogram_mode:
    base_name: histogram_mode
    dependencies:
    configs:
      - {num_bins: 5, do_simple: True, zscore: True, abs: False}
      - {num_bins: 10, do_simple: True, zscore: True, abs: False}
      - {num_bins: 21, do_simple: True, zscore: True, abs: False}
      - {num_bins: 5, do_simple: True, zscore: True, abs: True}
      - {num_bins: 10, do_simple: True, zscore: True, abs: True}
      - {num_bins: 21, do_simple: True, zscore: True, abs: True}
    hctsa_name: DN_HistogramMode
    ordered_args: ['num_bins']

  remove_points:
    base_name: remove_points
    dependencies:
    configs:
      - {remove_how: 'absclose', p: 0.1, remove_or_saturate: 'remove', zscore: True}
      - {remove_how: 'absclose', p: 0.5, remove_or_saturate: 'remove', zscore: True}
      - {remove_how: 'absclose', p: 0.8, remove_or_saturate: 'remove', zscore: True}

      - {remove_how: 'absfar', p: 0.1, remove_or_saturate: 'remove', zscore: True}
      - {remove_how: 'absfar', p: 0.8, remove_or_saturate: 'remove', zscore: True}
      - {remove_how: 'absfar', p: 0.1, remove_or_saturate: 'saturate', zscore: True}
      - {remove_how: 'absfar', p: 0.8, remove_or_saturate: 'saturate', zscore: True}

      - {remove_how: 'min', p: 0.1, remove_or_saturate: 'saturate', zscore: True}
      - {remove_how: 'min', p: 0.5, remove_or_saturate: 'saturate', zscore: True}
      - {remove_how: 'min', p: 0.8, remove_or_saturate: 'saturate', zscore: True}

      - {remove_how: 'max', p: 0.1, remove_or_saturate: 'saturate', zscore: True}
      - {remove_how: 'max', p: 0.8, remove_or_saturate: 'saturate', zscore: True}
    hctsa_name: DN_RemovePoints
    ordered_args: ['remove_how', 'p', 'remove_or_saturate']

  compare_ks_fit:
    base_name: compare_ks_fit
    dependencies:
    configs:
      - {what_distn: 'norm', zscore: False}
      - {what_distn: 'ev', zscore: False}
      - {what_distn: 'uni', zscore: False}
      - {what_distn: 'exp', zscore: False}
      - {what_distn: 'logn', zscore: False}
    legacy_name: DN_CompareKSFit
    ordered_args: ['what_distn']
    