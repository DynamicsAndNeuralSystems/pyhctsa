Entropy:
  distribution_entropy:
    base_name: distribution_entropy
    dependencies:
    configs:
      - {hist_or_ks: 'ks', num_bins: 0.01, olremp: 0, zscore: True}
      - {hist_or_ks: 'ks', num_bins: 0.1, olremp: 0, zscore: True}
      - {hist_or_ks: 'ks', num_bins: 0.5, olremp: 0, zscore: True}
      - {hist_or_ks: 'ks', num_bins: 1.0, olremp: 0, zscore: True}

      - {hist_or_ks: 'ks', num_bins: '', olremp: 0.01, zscore: True}
      - {hist_or_ks: 'ks', num_bins: '', olremp: 0.02, zscore: True}
      - {hist_or_ks: 'ks', num_bins: '', olremp: 0.05, zscore: True}
      - {hist_or_ks: 'ks', num_bins: '', olremp: 0.1, zscore: True}
      - {hist_or_ks: 'ks', num_bins: '', olremp: 0.2, zscore: True}
      - {hist_or_ks: 'ks', num_bins: '', olremp: 0.3, zscore: True}

      - {hist_or_ks: 'hist', num_bins: 5, olremp: 0, zscore: True}
      - {hist_or_ks: 'hist', num_bins: 10, olremp: 0, zscore: True}
      - {hist_or_ks: 'hist', num_bins: 20, olremp: 0, zscore: True}
      - {hist_or_ks: 'hist', num_bins: 50, olremp: 0, zscore: True}
      - {hist_or_ks: 'hist', num_bins: 'sqrt', olremp: 0, zscore: True}
      - {hist_or_ks: 'hist', num_bins: 'fd', olremp: 0, zscore: True}
      - {hist_or_ks: 'hist', num_bins: 'sturges', olremp: 0, zscore: True}
      
      - {hist_or_ks: 'hist', num_bins: 10, olremp: 0.01, zscore: True}
      - {hist_or_ks: 'hist', num_bins: 10, olremp: 0.02, zscore: True}
      - {hist_or_ks: 'hist', num_bins: 10, olremp: 0.05, zscore: True}
      - {hist_or_ks: 'hist', num_bins: 10, olremp: 0.1, zscore: True}
      - {hist_or_ks: 'hist', num_bins: 10, olremp: 0.2, zscore: True}
      - {hist_or_ks: 'hist', num_bins: 10, olremp: 0.3, zscore: True}
    legacy_name: EN_DistributionEntropy
    ordered_args: ['hist_or_ks', 'num_bins', 'olremp']
  
