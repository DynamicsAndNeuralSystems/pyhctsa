    ordered_args: ['tau']

  embed2_angle_tau:
    base_name: embed2_angle_tau
    dependencies:
    configs:
      - {max_tau: 50, zscore: True}
    legacy_name: CO_Embed2_AngleTau
    ordered_args: ['max_tau']
  
  partial_autocorr:
    base_name: partial_autocorr
    dependencies:
      - statsmodels
    configs:
      - {max_tau: 20, what_method: 'ols', zscore: True}
    legacy_name: CO_PartialAutoCorr
    ordered_args: ['max_tau', 'what_method']

