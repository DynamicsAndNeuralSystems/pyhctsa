Medical:
  hrv_classic:
    base_name: hrv_classic
    dependencies:
    configs:
      - {zscore: True}
    legacy_name: MD_hrv_classic

  pnn:
    base_name: pnn_raw
    dependencies:
    configs:
      - {zscore: False}
    legacy_name: MD_pNN

  pol_var:
    base_name: pol_var
    dependencies:
    configs:
      - {d: 1.0, D: 3, zscore: True}
      - {d: 1.0, D: 4, zscore: True}
      - {d: 1.0, D: 5, zscore: True}
      - {d: 1.0, D: 6, zscore: True}

      - {d: 0.5, D: 3, zscore: True}
      - {d: 0.5, D: 4, zscore: True}
      - {d: 0.5, D: 5, zscore: True}
      - {d: 0.5, D: 6, zscore: True}

      - {d: 0.1, D: 3, zscore: True}
      - {d: 0.1, D: 4, zscore: True}
      - {d: 0.1, D: 5, zscore: True}
      - {d: 0.1, D: 6, zscore: True}
    legacy_name: MD_polvar
    ordered_args: ['d', 'D']

  raw_hrv_meas:
    base_name: raw_hrv_meas
    dependencies:
    configs:
      - {zscore: False}
    legacy_name: MD_rawHRVmeas
