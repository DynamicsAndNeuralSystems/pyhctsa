    legacy_name: SY_SlidingWindow
    dropped_hctsa_calls:
      SY_SlidingWindow_m_s_2_1: &std_summary 'replaced by the ''stdratio'' summary: the plain spread across a fixed number of windows is mostly sampling error, which shrinks with series length'
      SY_SlidingWindow_m_s_10_1: *std_summary
      SY_SlidingWindow_s_s2_1: *std_summary
      SY_SlidingWindow_s_s10_1: *std_summary
      SY_SlidingWindow_mom3_s2_1: *std_summary
      SY_SlidingWindow_mom3_s10_1: *std_summary
      SY_SlidingWindow_ac1_s2_1: *std_summary
      SY_SlidingWindow_ac1_s10_1: *std_summary
      SY_SlidingWindow_permen_s2_1: *std_summary
      SY_SlidingWindow_permen_s5_10: *std_summary
      SY_SlidingWindow_specen_s2_1: *std_summary
      SY_SlidingWindow_specen_s5_1: *std_summary
      SY_SlidingWindow_asymac1_s2_1: &no_drift 'window statistic dropped: it does not respond to drift in the mean, variance or dynamics once the length effect is removed'
      SY_SlidingWindow_asymac1_s10_1: *no_drift
      SY_SlidingWindow_asymac1_s5_1_ac1e: *no_drift
      SY_SlidingWindow_asymac1_s10_1_ac1e: *no_drift
      SY_SlidingWindow_ent_s2_1: &kernel_ent 'kernel-entropy window statistic dropped: it tracks the same drift as std'
      SY_SlidingWindow_ent_s10_1: *kernel_ent
      SY_SlidingWindow_lil_s2_1: *no_drift
      SY_SlidingWindow_lil_s10_1: *no_drift
      SY_SlidingWindow_specen_ent5_1: 'the entropy summary of spectral entropy is dropped: it does not respond to drift once the length effect is removed'
