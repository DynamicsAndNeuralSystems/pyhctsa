      - {c0: 0.01, embed_params: [[1, 8]], zscore: True}
      - {c0: 0.01, embed_params: [['ac', 3]], zscore: True}
      - {c0: 0.01, embed_params: [['mi', 3]], zscore: True}
      - {c0: 0.01, embed_params: [['mi', ['fnn', 0.05]]], zscore: True}
