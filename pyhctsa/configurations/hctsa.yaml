    ordered_args: ['tau_mult', 'win_len_rel', 'shift_len_rel', 'degree']

  nlpe:
    base_name: nlpe
    dependencies:
    configs:
      - {de: 2, tau: 'mi', zscore: True, exclude: ['msqerr']}
      - {de: 3, tau: 'ac1e', zscore: True, exclude: ['msqerr']}
      - {de: [['fnn', 0.05]], tau: 'mi', zscore: True, exclude: ['msqerr']}
    ordered_args: ['de', 'tau']

  embed_pca:
    base_name: embed_pca
    dependencies:
    configs:
      - {tau: 'mi', m: 10, zscore: True, exclude: ['max', 'perc_1', 'perc_10', 'perc_6', 'perc_7', 'perc_8', 'perc_9']}
