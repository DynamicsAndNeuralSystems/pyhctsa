      - {hist_or_ks: 'ks', num_bins: null, olremp: 0.3, zscore: True}
      - {hist_or_ks: 'ks', num_bins: null, olremp: 0.05, zscore: True}
    ordered_args: ['hist_or_ks', 'num_bins', 'olremp']

  permutation_entropy:
    base_name: permutation_entropy
    configs:
      - {m: 2, tau: 1, zscore: True, select: ['normPermEn']}
      - {m: 3, tau: 1, zscore: True, select: ['normPermEn']}
      - {m: 4, tau: 1, zscore: True, select: ['normPermEn', 'ordAsym']}
      - {m: 5, tau: 1, zscore: True, exclude: ['permEn', 'permEnLE']}

      - {m: 2, tau: 2, zscore: True, select: ['normPermEn']}
      - {m: 3, tau: 2, zscore: True, select: ['normPermEn']}
      - {m: 4, tau: 2, zscore: True, select: ['normPermEn', 'ordAsym']}
      - {m: 5, tau: 2, zscore: True, exclude: ['permEn', 'permEnLE']}

      - {m: 2, tau: 'ac1e-rank', zscore: True, select: ['normPermEn']}
      - {m: 3, tau: 'ac1e-rank', zscore: True, select: ['normPermEn']}
      - {m: 3, tau: 10, zscore: True, select: ['normPermEn']}
      - {m: 4, tau: 'ac1e-rank', zscore: True, select: ['normPermEn', 'ordAsym']}
      - {m: 5, tau: 'ac1e-rank', zscore: True, exclude: ['permEn', 'permEnLE']}
    ordered_args: ['m', 'tau']

  lempel_ziv_complexity:
