    configs:
      - {tau: 1, m: 2, zscore: True}
      - {tau: 'ac1e', m: 2, zscore: True}
      - {tau: 'mi', m: 3, zscore: True}
    ordered_args: ['tau', 'm']

  embed_kernel_pca:
    base_name: embed_kernel_pca
    dependencies:
    configs:
      - {tau: 1, m: 10, zscore: True, exclude: ['fb05', 'max', 'min', 'nto70', 'nto80_diff', 'nto90', 'perc_10', 'perc_6', 'perc_7', 'perc_8', 'perc_9', 'range']}
      - {tau: 'ac1e', m: 3, zscore: True, exclude: ['fb05', 'max', 'min', 'nto70', 'nto80_diff', 'nto90', 'perc_3', 'range']}
      - {tau: 'mi', m: 10, zscore: True, exclude: ['fb05', 'max', 'min', 'nto70', 'nto80_diff', 'nto90', 'perc_10', 'perc_6', 'perc_7', 'perc_8', 'perc_9', 'range']}
    ordered_args: ['tau', 'm']

  fnn:
