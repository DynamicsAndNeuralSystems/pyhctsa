  nonlinear_autocorr_abs_surrogate_ratio:   # absval nonlinear_autocorr on Gaussian ranks / phase-randomized surrogates
    base_name: ac_nl_abs_surr_ratio
    dependencies:
    configs:   # the absval=True configs of nonlinear_autocorr
      - {taus: [[1, 2]], zscore: True}
      - {taus: [[1, 2, 3, 4]], zscore: True}
      - {taus: [[1, 2, 3, 4, 5, 6]], zscore: True}
      - {taus: [[1, 2, 3, 4, 5, 6, 7, 8]], zscore: True}
      - {taus: [[1, 3]], zscore: True}
