      - {nnr: 5, tau: 'ac1e', m: 2, zscore: True}
      - {nnr: 5, tau: 'ac1e', m: [['fnn', 0.05]], zscore: True}
    ordered_args: ['nnr', 'past', 'tau', 'm']

  tisean_d2:
    base_name: tisean_d2
    dependencies:
    configs:
