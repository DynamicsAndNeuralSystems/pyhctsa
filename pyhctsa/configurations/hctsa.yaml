      - {tau: 'mi', nsurr: 100, surr_method: 2, surrfn: 'trev', zscore: True, exclude: ['kspminfromext', 'ksphereonmax', 'ksiqrsfrommode', 'stdfrommean', 'ztestp', 'meannumsurr', 'meansurr', 'zsigned']}
      - {tau: 'mi', nsurr: 100, surr_method: 3, surrfn: 'trev', zscore: True, exclude: ['kspminfromext', 'ksphereonmax', 'ksiqrsfrommode', 'stdfrommean', 'ztestp', 'meannumsurr', 'meansurr', 'zsigned']}
