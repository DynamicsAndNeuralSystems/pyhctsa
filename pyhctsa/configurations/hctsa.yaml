      - {hist_or_ks: 'hist', num_bins: 10, olremp: 0.02, zscore: True}
      - {hist_or_ks: 'hist', num_bins: 10, olremp: 0.05, zscore: True}
      - {hist_or_ks: 'hist', num_bins: 10, olremp: 0.1, zscore: True}
