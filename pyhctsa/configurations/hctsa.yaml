      - {taus: [[0, 5]], zscore: True}
      - {taus: [[0, 6]], zscore: True}
      - {taus: [[1, 2, 3, 4]], tau: 'ac', zscore: True}   # delay 'ac' as nonlinear_autocorr's, from the Gaussian ranks
    variant_of: nonlinear_autocorr
    ordered_args: ['taus', 'tau']

  stick_angles:
    base_name: stick_angles
    dependencies:
    configs:
      - {zscore: True, exclude: ['statav2_all_m', 'statav3_all_m', 'statav4_all_m', 'statav5_all_m', 'statav5_all_s', 'tau_n']}
    ordered_args:

  falling_sticks:
    base_name: falling_sticks
    min_length: 4
    dependencies:
    configs:
      - {zscore: True, exclude: ['kurtosis_all', 'median_all', 'median_n', 'median_p']}
    ordered_args:

  first_crossing:
    base_name: first_crossing
    dependencies:
    configs:
      - {corr_fun: 'ac', threshold: 0, what_out: 'both', zscore: True}
      - {corr_fun: 'ac', threshold: '1/e', what_out: 'both', zscore: True}
      # the crossing times of the linearly detrended series
      - {corr_fun: 'ac', threshold: 0, what_out: 'both', zscore: True, preprocess: detrend}
      - {corr_fun: 'ac', threshold: '1/e', what_out: 'both', zscore: True, preprocess: detrend}
    ordered_args: ['corr_fun', 'threshold', 'what_out']

  translate_shape:
    base_name: translate_shape
    min_length: "2 * (int(d) if shape == 'rectangle' else floor(d)) + 1"
    dependencies:
    configs:
      - {shape: 'circle', d: 1.5, how_to_move: 'pts', zscore: True, exclude: ['max']}
      - {shape: 'circle', d: 2.5, how_to_move: 'pts', zscore: True, exclude: ['max']}
      - {shape: 'circle', d: 3.5, how_to_move: 'pts', zscore: True, exclude: ['max', 'sevens']}
      - {shape: 'rectangle', d: 2, how_to_move: 'pts', zscore: True, exclude: ['max']}
      - {d: 2.5, tau: 'ac1e', zscore: True, exclude: ['max']}
    ordered_args: ['shape', 'd', 'how_to_move', 'tau']

  autocorr_shape:
    base_name: autocorr_shape
    min_length: "4 if stop_when == 'pos_drown' else None"
    configs:
      - {stop_when: 'drown', zscore: True, exclude: ['decayTimescale', 'fexpacf_r2', 'fexpacf_stdres', 'nextrema', 'nmaxima']}
      - {stop_when: 'pos_drown', zscore: True, exclude: ['actau', 'nextrema', 'nmaxima']}
      # the ACF shape of the linearly detrended series
      - {stop_when: 'drown', zscore: True, exclude: ['decayTimescale', 'fexpacf_r2', 'fexpacf_stdres', 'nextrema', 'nmaxima'], preprocess: detrend}
      - {stop_when: 'pos_drown', zscore: True, exclude: ['actau', 'nextrema', 'nmaxima'], preprocess: detrend}
    ordered_args: ['stop_when']

  histogram_ami:
    base_name: histogram_ami
    min_length: 4
    field_min_length:
      # the bias-corrected AMI at lag k takes only two values with k + 2 points
      "ami{k}": "k + 3"
    dependencies:
    configs:
      - {tau: [[1, 2, 3, 4, 5]], meth: 'std1', num_bins: 2, zscore: True, select: ['ami1']}
      - {tau: [[1, 2, 3, 4, 5]], meth: 'std2', num_bins: 2, zscore: True, select: ['ami1', 'ami5']}
      - {tau: [[1, 2, 3, 4, 5]], meth: 'even', num_bins: 2, zscore: True}
      # the same AMIs of the linearly detrended series
      - {tau: [[1, 2, 3, 4, 5]], meth: 'std1', num_bins: 2, zscore: True, select: ['ami1'], preprocess: detrend}
      - {tau: [[1, 2, 3, 4, 5]], meth: 'std2', num_bins: 2, zscore: True, select: ['ami1', 'ami5'], preprocess: detrend}
      - {tau: [[1, 2, 3, 4, 5]], meth: 'even', num_bins: 2, zscore: True, preprocess: detrend}


    ordered_args: ['tau', 'meth', 'num_bins']

  compare_min_ami:
    base_name: compare_min_ami
    min_length: "5 if bin_method == 'quantiles' else None"
    dependencies:
    configs:
      - {bin_method: 'std1', num_bins: [!range [2, 80]], zscore: True, exclude: ['max', 'median', 'mode']}
      - {bin_method: 'std2', num_bins: [!range [2, 80]], zscore: True, select: ['mean', 'min', 'modef', 'nprompeaks', 'std']}
      - {bin_method: 'quantiles', num_bins: [!range [2, 80]], zscore: True, select: ['mean', 'min', 'modef', 'nprompeaks', 'std']}
      - {bin_method: 'even', num_bins: [!range [2, 80]], zscore: True, exclude: ['conv4', 'max', 'median', 'range']}
    ordered_args: ['bin_method', 'num_bins']

  periodicity_wang:
    base_name: periodicity_wang
    min_length: 13
    dependencies:
    configs:
      - {zscore: True}
    ordered_args:

  trev:
    base_name: trev
    field_min_length:
      # one lag-tau difference: raw is its sign (+-1) and abs is 1
      raw: "num(tau, 1) + 2"
      abs: "num(tau, 1) + 2"
    dependencies:
    configs:
      - {tau: 1, zscore: True}
      - {tau: 2, zscore: True}
      - {tau: 3, zscore: True}
      - {tau: 'ac', zscore: True}
      - {tau: 'mi', zscore: True}
      - {tau: 5, zscore: True, exclude: ['denom', 'num']}
      - {tau: 10, zscore: True, exclude: ['denom', 'num']}
    ordered_args: ['tau']

  trev_studentized:   # the trev numerator divided by its HAC (flat-top kernel) standard error
    base_name: trev_studentized
    dependencies:
    configs:
      - {tau: 1, zscore: True}
      - {tau: 2, zscore: True}
      - {tau: 3, zscore: True}
      - {tau: 'ac', zscore: True}
      - {tau: 'mi', zscore: True}
      - {tau: 5, zscore: True}
      - {tau: 10, zscore: True}
    variant_of: trev
    ordered_args: ['tau']

  reversibility_scan:   # studentized Ramsey-Rothman reversal asymmetry gamma_{i,j}(k) on Gaussian ranks, scanned over lags 1-20
    base_name: rev_scan
    dependencies:
    configs:
      - {i: 2, j: 1, zscore: True}
      - {i: 3, j: 1, zscore: True}
    variant_of: trev
    ordered_args: ['i', 'j']

  tc3:
    base_name: tc3
    dependencies:
    configs:
      - {tau: 1, zscore: True}
      - {tau: 2, zscore: True}
      - {tau: 3, zscore: True}
      - {tau: 'mi', zscore: True}
      - {tau: 5, zscore: True, exclude: ['denom', 'num']}
    ordered_args: ['tau']

  time_rev_kaplan:
    base_name: time_rev_kaplan
    dependencies:
    configs:
      - {time_lag: 1, zscore: True}
      - {time_lag: 2, zscore: True}
      - {time_lag: 3, zscore: True}
      - {time_lag: 4, zscore: True}
    ordered_args: ['time_lag']

  pos_neg_asymmetry:
    base_name: pos_neg_asymmetry
    dependencies:
    configs:
      - {zscore: True, exclude: ['propNP', 'propPN', 'propPos']}
    ordered_args:

  crinkle_statistic:
    base_name: crinkle_statistic
    dependencies:
    configs:
      - {zscore: True}
      - {tau: 'ac1e', zscore: True}
    ordered_args: ['tau']

  crinkle_statistic_kurtosis:   # excess kurtosis of the second difference, on Gaussian ranks
    base_name: crinkle_statistic_kurtosis
    dependencies:
    configs:
      - {zscore: True}
      - {tau: 'ac1e', zscore: True}   # delay from the Gaussian ranks (rank-invariant)
    variant_of: crinkle_statistic
    ordered_args: ['tau']

  theiler_q:
    base_name: theiler_q
    dependencies:
    configs:
      - {zscore: True}
    ordered_args:

  joint_non_gaussianity:
    base_name: joint_non_gaussianity
    dependencies:
    configs:
      - {tau: 'ac1e', m: 2, zscore: True}
      - {tau: 'ac1e', m: 3, zscore: True}
    ordered_args: ['m']

  matrix_profile:
    base_name: matrix_profile
    dependencies:
    configs:
      - {zscore: True, exclude: ['meanR']}

  quantilogram:
    base_name: quantilogram
    min_length: "max(30, 2 * lag + 1) if isnum(lag) else 9"
    dependencies:
    configs:
      - {lag: 1, zscore: True, select: ['q05', 'q95']}
      - {lag: 'mi', zscore: True, exclude: ['q25', 'q50', 'q75']}
    ordered_args: ['lag']

  remove_points:
    base_name: remove_points_ac
    min_length: "min(n for n in range(2, 1000) if n - round(n * (1 - p)) >= 1 and round(n * (1 - p)) >= 2)"
    dependencies:
    configs:
      - {remove_how: 'absclose', p: 0.1, remove_or_saturate: 'remove', zscore: True}
      - {remove_how: 'absclose', p: 0.5, remove_or_saturate: 'remove', zscore: True}
      - {remove_how: 'absclose', p: 0.8, remove_or_saturate: 'remove', zscore: True}
      - {remove_how: 'absfar', p: 0.1, remove_or_saturate: 'remove', zscore: True}
      - {remove_how: 'absfar', p: 0.1, remove_or_saturate: 'saturate', zscore: True}
      - {remove_how: 'absfar', p: 0.8, remove_or_saturate: 'remove', zscore: True}
      - {remove_how: 'absfar', p: 0.8, remove_or_saturate: 'saturate', zscore: True}
      - {remove_how: 'max', p: 0.1, remove_or_saturate: 'saturate', zscore: True}
      - {remove_how: 'max', p: 0.8, remove_or_saturate: 'saturate', zscore: True}
      - {remove_how: 'min', p: 0.1, remove_or_saturate: 'saturate', zscore: True}
      - {remove_how: 'min', p: 0.5, remove_or_saturate: 'saturate', zscore: True}
      - {remove_how: 'min', p: 0.8, remove_or_saturate: 'saturate', zscore: True}
    ordered_args: ['remove_how', 'p', 'remove_or_saturate']

