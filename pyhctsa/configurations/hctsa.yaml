      - {what_prior: 'dist', memory: 5, num_groups: 'ac1e', coarse_grain_method: 'embed2quadrants', zscore: True, exclude: ['median', 'propUnseen', 'sum', 'tstat']}
      - {what_prior: 'dist', memory: 20, num_groups: 'ac1e', coarse_grain_method: 'embed2quadrants', zscore: True, exclude: ['median', 'propUnseen', 'sum', 'tstat']}
      - {what_prior: 'T1', memory: 10, num_groups: 'ac1e', coarse_grain_method: 'embed2quadrants', zscore: True, exclude: ['median', 'sum', 'tstat']}
      - {what_prior: 'T1', memory: 50, num_groups: 3, coarse_grain_method: 'quantile', zscore: True, exclude: ['median', 'sum', 'tstat']}
      - {what_prior: 'T1', memory: 50, num_groups: 'ac1e', coarse_grain_method: 'embed2quadrants', zscore: True, exclude: ['median', 'sum', 'tstat']}
