# pyhctsa feature configuration: module -> master operation -> its parameter configs.
#
# Keys of a master operation (the operation's own key is its function's name in the module):
#   base_name         the stem of its feature labels
#   dependencies      optional packages it needs; without them it is skipped
#   configs           its parameter settings. A list value gives one config per element (wrap it in a
#                     second list to pass the list itself); !range [a, b] or [a, b, step] is the
#                     inclusive list a..b. The meta keys zscore, abs, preprocess, select and exclude
#                     are not passed to the function (see FeatureCalculator)
#   ordered_args      the parameters that make up each feature label, in order
#   variant_of        for a reformulation of another entry, the entry it reformulates
#   min_length, field_min_length   see below
#
# Comments: three spaces before '#', lowercase fragments with no full stop, US spelling. A comment
# says what a config or setting does, or why, in this package's terms. Correspondence with other
# software and a feature's history belong in hctsa_mapping.yaml, not here. Reasons for min_length
# and ordered_args trail their line; reasons for field_min_length entries go on the line above
# their key.
#
# min_length (optional, per master operation): the shortest series on which the feature is defined,
# as an int or a Python expression in the operation's parameters (configured values, else the
# function's defaults). Below it every output of the feature is NaN.
# These are the shortest lengths at which the computation is defined and its output can take more
# than two values (lags, embeddings, windows, model orders), set conservatively. They apply to the
# series the function receives, i.e. after zscore/preprocess (decimate_ac1e shortens the series).
# An operation whose own code already returns NaN below its bound has no min_length here (one
# bound per operation); one with neither is computed at any length N >= 3.
# Helpers available in expressions: num(x, d) (x if numeric, else d), isnum, fnn(x) (an ['fnn', p]
# dimension rule), dec_len(w_name) (wavelet filter length), floor, ceil, sqrt, round (half away
# from zero), max, min, int, range. See FeatureCalculator.

medical:
  hrv_classic:
    base_name: hrv_classic
    dependencies:
    configs:
      - {zscore: True, exclude: ['SD1', 'SD2']}

  pnn:
    base_name: pnn
    dependencies:
    configs:
      - {zscore: False, exclude: ['pnn30', 'pnn40', 'pnn60', 'pnn70', 'pnn80', 'pnn90']}

  pol_var:
    base_name: pol_var
    min_length: "2 * D + 1"
    dependencies:
    configs:
      - {d: 1.0, D: 3, zscore: True}
      - {d: 1.0, D: 4, zscore: True}
      - {d: 1.0, D: 5, zscore: True}
      - {d: 1.0, D: 6, zscore: True}

      - {d: 0.5, D: 3, zscore: True}
      - {d: 0.5, D: 4, zscore: True}
      - {d: 0.5, D: 5, zscore: True}
      - {d: 0.5, D: 6, zscore: True}

      - {d: 0.1, D: 3, zscore: True}
      - {d: 0.1, D: 4, zscore: True}
      - {d: 0.1, D: 5, zscore: True}
      - {d: 0.1, D: 6, zscore: True}
      - {D: 3, tau: 'ac1e', zscore: True}
    ordered_args: ['d', 'D', 'tau']

  pol_var_resid:   # pol_var on |AR(2) residuals| with a median threshold
    base_name: pol_var_resid
    min_length: "2 * D + ar_order"
    dependencies:
    configs:
      - {D: 3, zscore: True}
      - {D: 6, zscore: True}
    variant_of: pol_var
    ordered_args: ['D']

  raw_hrv_meas:
    base_name: hrv_meas
    dependencies:
    configs:
      - {zscore: False, exclude: ['tri10']}

  porta:
    base_name: porta
    min_length: 4
    dependencies:
    configs:
      - {zscore: True}   # robust levels
      - {tau: 'ac1e', zscore: True}
    ordered_args: ['num_levels', 'tau']   # num_levels is left at its default, so the labels are porta and porta_ac1e

extreme_events:
  moving_threshold:
    base_name: moving_threshold
    min_length: "ceil(1 / b)"   # the barrier's memory: a shorter series (or decimated phase) never leaves its start-up
    dependencies:
    configs:
      - {a: 0.1, b: 0.1, zscore: True, exclude: ['meankicksize']}
      - {a: 0.1, b: 0.02, zscore: True, exclude: ['meankicksize']}
      - {a: 1.0, b: 0.1, zscore: True, exclude: ['meankicksize']}
      - {a: 1.0, b: 0.02, zscore: True, exclude: ['meankicksize']}
      - {a: 0.1, b: 0.1, zscore: True, preprocess: decimate_ac1e, exclude: ['meankicksize']}
      - {a: 1, b: 0.02, zscore: True, preprocess: decimate_ac1e, exclude: ['meankicksize', 'pkick', 'meankickf', 'mediankickf', 'stdkickf']}
    ordered_args: ['a', 'b']

  extreme_event_order:
    base_name: extreme_event_order
    min_length: "min(n for n in range(2, 1000) if n * (1 - extreme_thresh) + 0.5 < n - 1)"
    dependencies:
    configs:
      - {extreme_thresh: 0.1, zscore: True, exclude: ['alternationRate', 'meanInterval', 'meanIntervalNeg', 'meanIntervalPos', 'propNP', 'propPosEvents']}
      - {extreme_thresh: 0.05, zscore: True, exclude: ['alternationRate', 'meanInterval', 'meanIntervalNeg', 'meanIntervalPos', 'propNP', 'propPosEvents']}
    ordered_args: ['extreme_thresh']

  extremogram:   # the largest extremogram value (recurrence of extremes of |x|) over lags 1-100
    base_name: extremogram
    dependencies:
    configs:
      - {quantile: 0.95, zscore: True}
      - {quantile: 0.98, zscore: True}
    variant_of: extreme_event_order
    ordered_args: ['quantile']

criticality:
  rad:
    base_name: rad
    dependencies:
    configs:
      - {tau: 1, zscore: True}
      - {tau: 2, zscore: True}
      - {tau: 'tau', zscore: True}
    ordered_args: ['tau']

correlation:

  oversampling:
    base_name: oversampling
    field_min_length:
      # 0 halvings below N = 200 and at most 1 below 399 (each needs >= 100 samples left)
      numHalvings: 399
    dependencies:
    configs:
      - {zscore: True}
    ordered_args:

  time_rev_kld:
    base_name: time_rev_kld
    dependencies:
    configs:
      - {tau: 'ac1e', m: 2, zscore: True}
      - {tau: 'ac1e', m: 3, zscore: True}
    ordered_args: ['tau', 'm', 'k', 'theiler_win', 'max_n']

  autocorr:
    base_name: ac
    dependencies:
    configs:
      - {tau: !range [1, 40], zscore: True}
      - {tau: 50, zscore: True}
      - {tau: 60, zscore: True}
      - {tau: 80, zscore: True}
      - {tau: 100, zscore: True}
      - {tau: 10, zscore: True, abs: True}
      - {tau: 20, zscore: True, abs: True}
      - {tau: 40, zscore: True, abs: True}
      - {tau: 80, zscore: True, abs: True}
      # the same lags on the linearly detrended series (ac_<tau>_lindt)
      - {tau: !range [1, 40], zscore: True, preprocess: detrend}
      - {tau: 50, zscore: True, preprocess: detrend}
      - {tau: 60, zscore: True, preprocess: detrend}
      - {tau: 80, zscore: True, preprocess: detrend}
      - {tau: 100, zscore: True, preprocess: detrend}
    ordered_args: ['tau']

  residual_autocorr_scan:   # the largest residual autocorrelation (and of squared residuals) over lags up to 300, after AR prewhitening
    base_name: resid_ac_scan
    dependencies:
    configs:
      - {zscore: True, exclude: ['peak_lag']}   # peak_lag: the scanned range grows with N
    variant_of: autocorr

  cyclostationarity_scan:   # spectral lines in the lag products of AR residuals (second-order cyclostationarity), over all cyclic frequencies and lags 0-20
    base_name: cyclo_scan
    min_length: 128
    dependencies:
    configs:
      - {zscore: True}
    variant_of: autocorr

  autocorr_x2_shape:
    base_name: acx2_shape
    min_length: "max_lag + 1 if isnum(max_lag) else None"
    dependencies:
    configs:
      - {max_lag: 15, exclude: ['maxLag', 'meanabsdiff', 'sumdiff'], zscore: True}
      - {max_lag: 'double_drown', zscore: True, exclude: ['meanabsdiff']}
    ordered_args: ['max_lag']

  add_noise:
    base_name: add_noise
    min_length: "max(extra_param + 1, num(tau, 1) + 2) if ami_method == 'quantiles' else num(tau, 1) + {'gaussian': 3, 'kraskov1': 6, 'kraskov2': 6}.get(ami_method, 2)"
    dependencies:
    configs:
      - {tau: 1,   ami_method: 'quantiles', extra_param: 10, num_draws: 10, zscore: True, exclude: ['ami_at_15', 'ami_at_20', 'fitexpadjr2', 'pcrossmean', 'pdec']}
      - {tau: 1,   ami_method: 'even',      extra_param: 10, num_draws: 10, zscore: True, exclude: ['ami_at_15', 'ami_at_20', 'fitexpadjr2', 'pcrossmean', 'pdec']}
      - {tau: 1,   ami_method: 'std1',      extra_param: 10, num_draws: 10, zscore: True, exclude: ['ami_at_15', 'ami_at_20', 'fitexpadjr2', 'pcrossmean', 'pdec']}
      - {tau: 1,   ami_method: 'gaussian',                   num_draws: 10, zscore: True, exclude: ['ami_at_15', 'ami_at_20', 'fitexpadjr2', 'meanch', 'pcrossmean', 'pdec']}
      - {tau: 1,   ami_method: 'kraskov1',  extra_param: 4,  num_draws: 5, zscore: True, exclude: ['ami_at_15', 'ami_at_20', 'fitexpadjr2', 'pcrossmean', 'pdec']}

      - {tau: 'ac', ami_method: 'gaussian',                   num_draws: 10, zscore: True, exclude: ['ami_at_15', 'ami_at_20', 'fitexpadjr2', 'pcrossmean', 'pdec']}
      - {tau: 'ac1e', ami_method: 'even', extra_param: 10, num_draws: 10, zscore: True, exclude: ['ami_at_15', 'ami_at_20', 'fitexpadjr2', 'pcrossmean', 'pdec']}
      - {tau: 'ac1e', ami_method: 'kraskov1', extra_param: 4, num_draws: 5, zscore: True, exclude: ['ami_at_15', 'ami_at_20', 'fitexpadjr2', 'pcrossmean', 'pdec']}
      - {tau: 'ac1e', ami_method: 'quantiles', extra_param: 10, num_draws: 10, zscore: True, exclude: ['ami_at_15', 'ami_at_20', 'fitexpadjr2', 'pcrossmean', 'pdec']}
      - {tau: 'ac1e', ami_method: 'std1', extra_param: 10, num_draws: 10, zscore: True, exclude: ['ami_at_15', 'ami_at_20', 'fitexpadjr2', 'pcrossmean', 'pdec']}
    ordered_args: ['tau', 'ami_method', 'extra_param']

  glscf:
    base_name: glscf
    min_length: "num(tau, 1) + 3"
    dependencies:
    configs:
      - {alpha: 1, beta: 1, tau: 1, zscore: True}
      - {alpha: 1, beta: 1, tau: 2, zscore: True}
      - {alpha: 1, beta: 1, tau: 3, zscore: True}
      - {alpha: 1, beta: 1, tau: 4, zscore: True}
      - {alpha: 1, beta: 1, tau: 5, zscore: True}

      - {alpha: 1, beta: 2, tau: 1, zscore: True}
      - {alpha: 1, beta: 2, tau: 2, zscore: True}
      - {alpha: 1, beta: 2, tau: 3, zscore: True}
      - {alpha: 1, beta: 2, tau: 4, zscore: True}
      - {alpha: 1, beta: 2, tau: 5, zscore: True}

      - {alpha: 1, beta: 5, tau: 1, zscore: True}
      - {alpha: 1, beta: 5, tau: 2, zscore: True}
      - {alpha: 1, beta: 5, tau: 3, zscore: True}
      - {alpha: 1, beta: 5, tau: 4, zscore: True}
      - {alpha: 1, beta: 5, tau: 5, zscore: True}

      - {alpha: 1, beta: 10, tau: 1, zscore: True}
      - {alpha: 1, beta: 10, tau: 2, zscore: True}
      - {alpha: 1, beta: 10, tau: 3, zscore: True}
      - {alpha: 1, beta: 10, tau: 4, zscore: True}
      - {alpha: 1, beta: 10, tau: 5, zscore: True}

      - {alpha: 2, beta: 2, tau: 1, zscore: True}
      - {alpha: 2, beta: 2, tau: 2, zscore: True}
      - {alpha: 2, beta: 2, tau: 3, zscore: True}
      - {alpha: 2, beta: 2, tau: 5, zscore: True}

      - {alpha: 2, beta: 5, tau: 1, zscore: True}
      - {alpha: 2, beta: 5, tau: 2, zscore: True}
      - {alpha: 2, beta: 5, tau: 3, zscore: True}
      - {alpha: 2, beta: 5, tau: 4, zscore: True}
      - {alpha: 2, beta: 5, tau: 5, zscore: True}
      - {alpha: 1, beta: 1, tau: 'mi', zscore: True}
      - {alpha: 1, beta: 2, tau: 'mi', zscore: True}
      - {alpha: 1, beta: 5, tau: 'mi', zscore: True}
      - {alpha: 1, beta: 10, tau: 'mi', zscore: True}
      - {alpha: 2, beta: 2, tau: 4, zscore: True}
      - {alpha: 2, beta: 2, tau: 'mi', zscore: True}
      - {alpha: 2, beta: 5, tau: 'mi', zscore: True}
    ordered_args: ['alpha', 'beta', 'tau']

  fzcglscf:
    base_name: fzcglscf
    min_length: 4
    dependencies:
    configs:
      - {alpha: 1.0, beta: 1, zscore: True}
      - {alpha: 1.0, beta: 2, zscore: True}
      - {alpha: 1.0, beta: 3, zscore: True}
      - {alpha: 1.0, beta: 4, zscore: True}
      - {alpha: 1.0, beta: 5, zscore: True}
      - {alpha: 1.0, beta: 6, zscore: True}
      - {alpha: 1.0, beta: 7, zscore: True}
      - {alpha: 1.0, beta: 8, zscore: True}
      - {alpha: 1.0, beta: 9, zscore: True}
      - {alpha: 1.0, beta: 10, zscore: True}

      - {alpha: 2.0, beta: 2, zscore: True}
      - {alpha: 2.0, beta: 5, zscore: True}
      - {alpha: 2.0, beta: 10, zscore: True}

      - {alpha: 5.0, beta: 5, zscore: True}
      - {alpha: 5.0, beta: 10, zscore: True}

      - {alpha: 10, beta: 10, zscore: True}
    ordered_args: ['alpha', 'beta']

  embed2:
    base_name: embed2
    min_length: "num(tau, 1) + 5"
    dependencies:
    configs:
      - {tau: 'tau', zscore: True}
      - {tau: 1, zscore: True, select: ['stdb1', 'stdb2', 'stdb3', 'stdb4', 'theta_ac2', 'theta_ac3', 'theta_std']}
    ordered_args: ['tau']

  embed2_shapes:
    base_name: embed2_shapes
    dependencies:
    configs:
      - {tau: 'ac1e', r: 0.1, zscore: True}
      - {tau: 'ac1e', r: 1, zscore: True}
    ordered_args: ['tau', 'shape', 'r']

  embed2_basic:
    base_name: embed2_basic
    dependencies:
    configs:
      - {tau: 1, zscore: True}
      - {tau: 'ac1e', zscore: True}
    ordered_args: ['tau']

  embed2_dist:
    base_name: embed2_dist
    min_length: "num(tau, 1) + 2"
    dependencies:
    configs:
      - {tau: 'tau', zscore: True, exclude: ['d_expfit_nlogL', 'd_mean']}
      - {tau: 1, zscore: True, select: ['d_ac1', 'd_ac3']}
    ordered_args: ['tau']

  embed2_angle_tau:
    base_name: embed2_angle_tau
    dependencies:
    configs:
      - {max_tau: 50, zscore: True}
    ordered_args: ['max_tau']

  partial_autocorr:
    base_name: partial_autocorr
    dependencies:
      - statsmodels
    configs:
      - {max_tau: 20, what_method: 'burg', zscore: True, exclude: ['pac_1']}
      - {max_tau: 20, what_method: 'burg', zscore: True, exclude: ['pac_1'], preprocess: detrend}
    ordered_args: ['max_tau', 'what_method']

  nonlinear_autocorr:
    base_name: ac_nl
    dependencies:
    configs:
      - {taus: [[1, 2]], absval: True, zscore: True}
      - {taus: [[1, 2, 3]], absval: False, zscore: True}
      - {taus: [[1, 2, 3, 4]], absval: False, zscore: True}
      - {taus: [[1, 2, 3, 4]], absval: True, zscore: True}
      - {taus: [[1, 2, 3, 4, 5]], absval: False, zscore: True}
      - {taus: [[1, 2, 3, 4, 5, 6]], absval: False, zscore: True}
      - {taus: [[1, 2, 3, 4, 5, 6]], absval: True, zscore: True}
      - {taus: [[1, 2, 3, 4, 5, 6, 7]], absval: False, zscore: True}
      - {taus: [[1, 2, 3, 4, 5, 6, 7, 8]], absval: False, zscore: True}
      - {taus: [[1, 2, 3, 4, 5, 6, 7, 8]], absval: True, zscore: True}

      - {taus: [[1, 3]], absval: False, zscore: True}
      - {taus: [[1, 3]], absval: True, zscore: True}
      - {taus: [[2, 4]], absval: True, zscore: True}

      - {taus: [[1, 3, 5]], absval: False, zscore: True}
      - {taus: [[2, 4, 6]], absval: False, zscore: True}

      - {taus: [[1, 3, 5, 7]], absval: False, zscore: True}
      - {taus: [[1, 3, 5, 7]], absval: True, zscore: True}

      - {taus: [[2, 4, 6, 8]], absval: False, zscore: True}
      - {taus: [[2, 4, 6, 8]], absval: True, zscore: True}

      - {taus: [[1, 2, 4]], absval: False, zscore: True}
      - {taus: [[1, 3, 4]], absval: False, zscore: True}

      - {taus: [[1, 4]], absval: False, zscore: True}
      - {taus: [[1, 4]], absval: True, zscore: True}

      - {taus: [[1, 1]], absval: False, zscore: True}
      - {taus: [[1, 1]], absval: True, zscore: True}

      - {taus: [[2, 2]], absval: False, zscore: True}
      - {taus: [[2, 2]], absval: True, zscore: True}

      - {taus: [[3, 3]], absval: False, zscore: True}
      - {taus: [[3, 3]], absval: True, zscore: True}

      - {taus: [[4, 4]], absval: False, zscore: True}
      - {taus: [[4, 4]], absval: True, zscore: True}

      - {taus: [[5, 5]], absval: False, zscore: True}
      - {taus: [[5, 5]], absval: True, zscore: True}

      - {taus: [[6, 6]], absval: False, zscore: True}
      - {taus: [[6, 6]], absval: True, zscore: True}

      - {taus: [[0, 1, 1]], absval: False, zscore: True}
      - {taus: [[0, 2, 2]], absval: False, zscore: True}
      - {taus: [[0, 3, 3]], absval: False, zscore: True}
      - {taus: [[0, 4, 4]], absval: False, zscore: True}
      - {taus: [[0, 5, 5]], absval: False, zscore: True}
      - {taus: [[0, 6, 6]], absval: False, zscore: True}

      - {taus: [[0, 0, 1]], absval: False, zscore: True}
      - {taus: [[0, 0, 2]], absval: False, zscore: True}
      - {taus: [[0, 0, 3]], absval: False, zscore: True}
      - {taus: [[0, 0, 4]], absval: False, zscore: True}
      - {taus: [[0, 0, 5]], absval: False, zscore: True}
      - {taus: [[0, 0, 6]], absval: False, zscore: True}
      - {taus: [[1, 1, 1]], absval: False, zscore: True}
      - {taus: [[2, 2, 2]], absval: False, zscore: True}
      - {taus: [[3, 3, 3]], absval: False, zscore: True}
      - {taus: [[4, 4, 4]], absval: False, zscore: True}
      - {taus: [[5, 5, 5]], absval: False, zscore: True}
      - {taus: [[6, 6, 6]], absval: False, zscore: True}

      - {taus: [[0, 1, 2]], absval: False, zscore: True}
      - {taus: [[0, 1, 3]], absval: False, zscore: True}
      - {taus: [[0, 2, 3]], absval: False, zscore: True}
      - {taus: [[0, 1, 4]], absval: False, zscore: True}
      - {taus: [[0, 2, 4]], absval: False, zscore: True}
      - {taus: [[0, 3, 4]], absval: False, zscore: True}
      - {taus: [[0, 1, 5]], absval: False, zscore: True}
      - {taus: [[0, 2, 5]], absval: False, zscore: True}
      - {taus: [[0, 3, 5]], absval: False, zscore: True}
      - {taus: [[0, 4, 5]], absval: False, zscore: True}
      - {taus: [[0, 1, 6]], absval: False, zscore: True}
      - {taus: [[0, 2, 6]], absval: False, zscore: True}
      - {taus: [[0, 3, 6]], absval: False, zscore: True}
      - {taus: [[0, 4, 6]], absval: False, zscore: True}
      - {taus: [[0, 5, 6]], absval: False, zscore: True}
      - {taus: [[1, 1, 2]], absval: False, zscore: True}
      - {taus: [[1, 1, 3]], absval: False, zscore: True}
      - {taus: [[1, 2, 2]], absval: False, zscore: True}
      - {taus: [[1, 3, 3]], absval: False, zscore: True}
      - {taus: [[2, 2, 3]], absval: False, zscore: True}
      - {taus: [[2, 3, 3]], absval: False, zscore: True}
      - {taus: [[0, 1]], absval: False, zscore: True}
      - {taus: [[0, 1]], absval: True, zscore: True}
      - {taus: [[0, 2]], absval: False, zscore: True}
      - {taus: [[0, 2]], absval: True, zscore: True}
      - {taus: [[0, 3]], absval: False, zscore: True}
      - {taus: [[0, 3]], absval: True, zscore: True}
      - {taus: [[0, 4]], absval: False, zscore: True}
      - {taus: [[0, 4]], absval: True, zscore: True}
      - {taus: [[0, 5]], absval: False, zscore: True}
      - {taus: [[0, 5]], absval: True, zscore: True}
      - {taus: [[0, 6]], absval: False, zscore: True}
      - {taus: [[0, 6]], absval: True, zscore: True}
      - {taus: [[0, 3, 6]], absval: False, tau: 'ac1e', zscore: True}
      - {taus: [[1, 1, 2]], absval: False, tau: 'ac1e', zscore: True}
      - {taus: [[1, 2, 3, 4]], absval: True, tau: 'ac', zscore: True}   # delay 'ac' chosen by test
    ordered_args: ['taus', 'absval', 'tau']

  nonlinear_autocorr_excess:   # nonlinear_autocorr minus its Gaussian (Isserlis) value, on Gaussian ranks
    base_name: ac_nl_excess
    dependencies:
    configs:   # the absval=False configs of nonlinear_autocorr
      - {taus: [[1, 2, 3]], zscore: True}
      - {taus: [[1, 2, 3, 4]], zscore: True}
      - {taus: [[1, 2, 3, 4, 5]], zscore: True}
      - {taus: [[1, 2, 3, 4, 5, 6]], zscore: True}
      - {taus: [[1, 2, 3, 4, 5, 6, 7]], zscore: True}
      - {taus: [[1, 2, 3, 4, 5, 6, 7, 8]], zscore: True}
      - {taus: [[1, 3]], zscore: True}
      - {taus: [[1, 3, 5]], zscore: True}
      - {taus: [[2, 4, 6]], zscore: True}
      - {taus: [[1, 3, 5, 7]], zscore: True}
      - {taus: [[2, 4, 6, 8]], zscore: True}
      - {taus: [[1, 2, 4]], zscore: True}
