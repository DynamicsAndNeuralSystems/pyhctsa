      - {psd_meth: 'welch', window_type: 'rect', zscore: True, exclude: ['fpoly2_sse', 'linfitloglog_all_sea1', 'linfitloglog_hf_sea1', 'linfitsemilog_all_sea1', 'median', 'q25', 'q75', 'spect_shann_ent', 'std']}
      - {zscore: True, exclude: ['fpoly2_sse', 'linfitloglog_all_sea1', 'linfitloglog_hf_sea1', 'linfitsemilog_all_sea1', 'meanPeakWidth_prom5', 'meanProm_5', 'median', 'numPeaks_50power', 'numPromPeaks_3', 'numPromPeaks_5', 'numPromPeaks_8', 'peakpower_1', 'peakPower_2', 'peakPower_5', 'peakPower_prom5', 'q25', 'q75', 'spect_shann_ent', 'std', 'w_weighted_peak_prom', 'width_weighted_prom']}
