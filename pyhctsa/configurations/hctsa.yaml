      - {hist_or_ks: 'hist', num_bins: 10, olremp: 0, zscore: True}
      - {hist_or_ks: 'hist', num_bins: 20, olremp: 0, zscore: True}
      - {hist_or_ks: 'hist', num_bins: 50, olremp: 0, zscore: True}

