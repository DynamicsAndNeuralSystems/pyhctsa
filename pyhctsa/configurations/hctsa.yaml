      - {the_test: 'ks', the_distn: 'wbl', zscore: False}
    ordered_args: ['the_test', 'the_distn', 'num_bins']

  variance_ratio_test:
    base_name: variance_ratio_test
    min_length: "2 * (max(periods) if isinstance(periods, list) else periods) + 1"
    dependencies:
      - arch
    configs:
      - {periods: 2, iids: 0, zscore: True, select: ['ratio']}
      - {periods: 4, iids: 0, zscore: True, select: ['ratio']}
      - {periods: [[2, 4, 6, 8, 2, 4, 6, 8]], iids: [[0, 0, 0, 0, 1, 1, 1, 1]], zscore: True, exclude: ['maxratio', 'maxstat', 'meanratio', 'meanstat', 'minstat']}
    ordered_args: ['periods', 'iids']

  independence_tests:
    base_name: independence_tests
    min_length: "4 if the_test == 'runsz' else None"
    dependencies:
    configs:
      - {the_test: 'lbq', zscore: True}
      - {the_test: 'runsz', zscore: False}
    ordered_args: ['the_test']

  marginal_tests:
    base_name: marginal_tests
    min_length: "{'signtest': 6, 'signrank': 5}.get(the_test)"
    dependencies:
    configs:
      - {the_test: 'logjb', zscore: False}
      - {the_test: 'signrank', zscore: True}
      - {the_test: 'signtest', zscore: True}
    ordered_args: ['the_test']

spectral:

  cross_frequency_coupling:   # phase-amplitude coupling (modulation index) and lagged amplitude envelope correlation between frequency bands
