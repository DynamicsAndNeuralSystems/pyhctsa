      - {L: 30, zscore: True}
      - {L: 100, zscore: True}
    ordered_args: ['L']

  zero_one_test:
    base_name: zero_one_test
    field_min_length:
      # K is a correlation over lags 1..N//10: with 2 lags (N < 30) it is +-1 (in practice 1)
      K: 30
      Kstd: 30
    dependencies:
    configs:
      - {num_c: 20, max_n: 'full', zscore: True}
    ordered_args: ['num_c', 'max_n']

  local_density:
