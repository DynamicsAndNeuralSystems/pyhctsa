medical:
  hrv_classic:
    base_name: hrv_classic
    dependencies:
    configs:
      - {zscore: True, exclude: ['SD1', 'SD2']}
    legacy_name: MD_hrv_classic

  pnn:
    base_name: pnn
    dependencies:
    configs:
      - {zscore: False}
    legacy_name: MD_pNN 

  pol_var:
    base_name: pol_var
    dependencies:
    configs:
      - {d: 1.0, D: 3, zscore: True}
      - {d: 1.0, D: 4, zscore: True}
      - {d: 1.0, D: 5, zscore: True}
      - {d: 1.0, D: 6, zscore: True}

      - {d: 0.5, D: 3, zscore: True}
      - {d: 0.5, D: 4, zscore: True}
      - {d: 0.5, D: 5, zscore: True}
      - {d: 0.5, D: 6, zscore: True}

      - {d: 0.1, D: 3, zscore: True}
      - {d: 0.1, D: 4, zscore: True}
      - {d: 0.1, D: 5, zscore: True}
      - {d: 0.1, D: 6, zscore: True}
      - {D: 3, zscore: True, preprocess: decimate_ac1e}   # MD_PolVar(zscore(BF_PreProcess(x_z,'decimate_ac1e')),1,3)
    legacy_name: MD_PolVar
    ordered_args: ['d', 'D']

  raw_hrv_meas:
    base_name: hrv_meas
    dependencies:
    configs:
      - {zscore: False}
    legacy_name: MD_RawHRVMeas
  
  porta:
    base_name: porta
    dependencies:
    configs:
      - {num_levels: 6, zscore: True}
      - {zscore: True, preprocess: decimate_ac1e}   # MD_Porta(zscore(BF_PreProcess(x_z,'decimate_ac1e')),6)
    legacy_name: MD_Porta
    
extreme_events:
  moving_threshold:
    base_name: moving_threshold
    dependencies:
    configs:
      - {a: 0.1, b: 0.1, zscore: True, exclude: ['meankicksize']}
      - {a: 0.1, b: 0.02, zscore: True, exclude: ['meankicksize']}
      - {a: 1.0, b: 0.1, zscore: True, exclude: ['meankicksize']}
      - {a: 1.0, b: 0.02, zscore: True, exclude: ['meankicksize']}
      - {a: 0.1, b: 0.1, zscore: True, preprocess: decimate_ac1e, exclude: ['meankicksize']}   # EX_MovingThreshold(zscore(BF_PreProcess(x_z,'decimate_ac1e')),0.1,0.1)
      - {a: 1, b: 0.02, zscore: True, preprocess: decimate_ac1e, exclude: ['meankicksize']}   # EX_MovingThreshold(zscore(BF_PreProcess(x_z,'decimate_ac1e')),1,0.02)
    legacy_name: EX_MovingThreshold
    ordered_args: ['a', 'b']

  extreme_event_order:
    base_name: extreme_event_order
    dependencies:
    configs:
      - {extreme_thresh: 0.1, zscore: True, exclude: ['alternationRate', 'meanInterval', 'meanIntervalNeg', 'meanIntervalPos', 'propNP', 'propPosEvents']}   # EX_ExtremeEventOrder(x_z,0.1)
      - {extreme_thresh: 0.05, zscore: True, exclude: ['alternationRate', 'meanInterval', 'meanIntervalNeg', 'meanIntervalPos', 'propNP', 'propPosEvents']}   # EX_ExtremeEventOrder(x_z,0.05)
    legacy_name: EX_ExtremeEventOrder
    ordered_args: ['extreme_thresh']

criticality:
  rad:
    base_name: rad
    dependencies:
    configs:
      - {tau: 1, zscore: True}
      - {tau: 2, zscore: True}
      - {tau: 'tau', zscore: True}
    legacy_name: CR_RAD
    ordered_args: ['tau']
    
correlation:

  oversampling:
    base_name: oversampling
    dependencies:
    configs:
      - {zscore: True}
    legacy_name: CO_Oversampling
    ordered_args:
  
  time_rev_kld:
    base_name: time_rev_kld
    dependencies:
    configs:
      - {tau: 'ac1e', m: 2, zscore: True}   # CO_TimeRevKLD(x_z,'ac1e',2,3,{'ac',1},'full')
      - {tau: 'ac1e', m: 3, zscore: True}   # CO_TimeRevKLD(x_z,'ac1e',3,3,{'ac',1},'full')
    legacy_name: CO_TimeRevKLD
    ordered_args: ['tau', 'm', 'k', 'theiler_win', 'max_n']

  autocorr:
    base_name: ac
    dependencies:
    configs:
      - {tau: !range [1, 40], zscore: True}
      - {tau: 50, zscore: True}   # CO_AutoCorr(x_z,50,'Fourier')
      - {tau: 60, zscore: True}   # CO_AutoCorr(x_z,60,'Fourier')
      - {tau: 80, zscore: True}   # CO_AutoCorr(x_z,80,'Fourier')
      - {tau: 100, zscore: True}   # CO_AutoCorr(x_z,100,'Fourier')
      - {tau: 10, zscore: True, abs: True}   # CO_AutoCorr(abs(x_z),10,'Fourier')
      - {tau: 20, zscore: True, abs: True}   # CO_AutoCorr(abs(x_z),20,'Fourier')
      - {tau: 40, zscore: True, abs: True}   # CO_AutoCorr(abs(x_z),40,'Fourier')
      - {tau: 80, zscore: True, abs: True}   # CO_AutoCorr(abs(x_z),80,'Fourier')
    legacy_name: CO_AutoCorr
    ordered_args: ['tau']
  
  autocorr_x2_shape:
    base_name: acx2_shape
    dependencies:
    configs:
      - {max_lag: 15, exclude: ['maxLag', 'sumdiff'], zscore: True}
      - {max_lag: 'double_drown', zscore: True}   # CO_AutoCorrX2Shape(x_z,'doubleDrown')
    legacy_name: CO_AutoCorrX2Shape
    ordered_args: ['max_lag']
  
  add_noise:
    base_name: add_noise
    dependencies:
    configs:
      - {tau: 1,   ami_method: 'quantiles', extra_param: 10, zscore: True, exclude: ['fitexpadjr2']}
      - {tau: 1,   ami_method: 'even',      extra_param: 10, zscore: True, exclude: ['fitexpadjr2']}
      - {tau: 1,   ami_method: 'std1',      extra_param: 10, zscore: True, exclude: ['fitexpadjr2']}
      - {tau: 1,   ami_method: 'gaussian',                   zscore: True, exclude: ['fitexpadjr2', 'meanch']}
      - {tau: 1,   ami_method: 'kraskov1',  extra_param: 4,  zscore: True, exclude: ['fitexpadjr2']}

      - {tau: 'ac', ami_method: 'gaussian',                   zscore: True, exclude: ['fitexpadjr2']}
      - {tau: 'ac1e', ami_method: 'even', extra_param: 10, zscore: True, exclude: ['fitexpadjr2']}   # CO_AddNoise(x_z,'ac1e','even',10,'default')
      - {tau: 'ac1e', ami_method: 'kraskov1', extra_param: 4, zscore: True, exclude: ['fitexpadjr2']}   # CO_AddNoise(x_z,'ac1e','kraskov1','4','default')
      - {tau: 'ac1e', ami_method: 'quantiles', extra_param: 10, zscore: True, exclude: ['fitexpadjr2']}   # CO_AddNoise(x_z,'ac1e','quantiles',10,'default')
      - {tau: 'ac1e', ami_method: 'std1', extra_param: 10, zscore: True, exclude: ['fitexpadjr2']}   # CO_AddNoise(x_z,'ac1e','std1',10,'default')
    legacy_name: CO_AddNoise
    ordered_args: ['tau', 'ami_method', 'extra_param']

  glscf:
    base_name: glscf
    dependencies:
    configs:
      - {alpha: 1, beta: 1, tau: 1, zscore: True}
      - {alpha: 1, beta: 1, tau: 2, zscore: True}
      - {alpha: 1, beta: 1, tau: 3, zscore: True}
      - {alpha: 1, beta: 1, tau: 4, zscore: True}
      - {alpha: 1, beta: 1, tau: 5, zscore: True}

      - {alpha: 1, beta: 2, tau: 1, zscore: True}
      - {alpha: 1, beta: 2, tau: 2, zscore: True}
      - {alpha: 1, beta: 2, tau: 3, zscore: True}
      - {alpha: 1, beta: 2, tau: 4, zscore: True}
      - {alpha: 1, beta: 2, tau: 5, zscore: True}

      - {alpha: 1, beta: 5, tau: 1, zscore: True}
      - {alpha: 1, beta: 5, tau: 2, zscore: True}
      - {alpha: 1, beta: 5, tau: 3, zscore: True}
      - {alpha: 1, beta: 5, tau: 4, zscore: True}
      - {alpha: 1, beta: 5, tau: 5, zscore: True}

      - {alpha: 1, beta: 10, tau: 1, zscore: True}
      - {alpha: 1, beta: 10, tau: 2, zscore: True}
      - {alpha: 1, beta: 10, tau: 3, zscore: True}
      - {alpha: 1, beta: 10, tau: 4, zscore: True}
      - {alpha: 1, beta: 10, tau: 5, zscore: True}

      - {alpha: 2, beta: 2, tau: 1, zscore: True}
      - {alpha: 2, beta: 2, tau: 2, zscore: True}
      - {alpha: 2, beta: 2, tau: 3, zscore: True}
      - {alpha: 2, beta: 2, tau: 5, zscore: True}

      - {alpha: 2, beta: 5, tau: 1, zscore: True}
      - {alpha: 2, beta: 5, tau: 2, zscore: True}
      - {alpha: 2, beta: 5, tau: 3, zscore: True}
      - {alpha: 2, beta: 5, tau: 4, zscore: True}
      - {alpha: 2, beta: 5, tau: 5, zscore: True}
      - {alpha: 1, beta: 1, tau: 'mi', zscore: True}   # CO_GLSCF(x_z,1,1,'mi')
      - {alpha: 1, beta: 2, tau: 'mi', zscore: True}   # CO_GLSCF(x_z,1,2,'mi')
      - {alpha: 1, beta: 5, tau: 'mi', zscore: True}   # CO_GLSCF(x_z,1,5,'mi')
      - {alpha: 1, beta: 10, tau: 'mi', zscore: True}   # CO_GLSCF(x_z,1,10,'mi')
      - {alpha: 2, beta: 2, tau: 4, zscore: True}   # CO_GLSCF(x_z,2,2,4)
      - {alpha: 2, beta: 2, tau: 'mi', zscore: True}   # CO_GLSCF(x_z,2,2,'mi')
      - {alpha: 2, beta: 5, tau: 'mi', zscore: True}   # CO_GLSCF(x_z,2,5,'mi')
    legacy_name: CO_GLSCF
    ordered_args: ['alpha', 'beta', 'tau']
  
  fzcglscf:
    base_name: fzcglscf
    dependencies:
    configs:
      - {alpha: 1.0, beta: 1, zscore: True}
      - {alpha: 1.0, beta: 2, zscore: True}
      - {alpha: 1.0, beta: 3, zscore: True}
      - {alpha: 1.0, beta: 4, zscore: True}
      - {alpha: 1.0, beta: 5, zscore: True}
      - {alpha: 1.0, beta: 6, zscore: True}
      - {alpha: 1.0, beta: 7, zscore: True}
      - {alpha: 1.0, beta: 8, zscore: True}
      - {alpha: 1.0, beta: 9, zscore: True}
      - {alpha: 1.0, beta: 10, zscore: True}

      - {alpha: 2.0, beta: 2, zscore: True}
      - {alpha: 2.0, beta: 5, zscore: True}
      - {alpha: 2.0, beta: 10, zscore: True}

      - {alpha: 5.0, beta: 5, zscore: True}
      - {alpha: 5.0, beta: 10, zscore: True}

      - {alpha: 10, beta: 10, zscore: True}
    legacy_name: CO_FZCGLSCF
    ordered_args: ['alpha', 'beta']

  embed2:
    base_name: embed2
    dependencies:
    configs:
      - {tau: 'tau', zscore: True}
      - {tau: 1, zscore: True, select: ['stdb1', 'stdb2', 'stdb3', 'stdb4', 'theta_ac2', 'theta_ac3', 'theta_std']}   # CO_Embed2(x_z,1)
    legacy_name: CO_Embed2
    ordered_args: ['tau']

  embed2_shapes:
    base_name: embed2_shapes
    dependencies:
    configs:
      - {tau: 'ac1e', r: 0.1, zscore: True}   # CO_Embed2_Shapes(x_z,'ac1e','circle',0.1,{'ac',1})
      - {tau: 'ac1e', r: 1, zscore: True}   # CO_Embed2_Shapes(x_z,'ac1e','circle',1,{'ac',1})
    legacy_name: CO_Embed2_Shapes
    ordered_args: ['tau', 'shape', 'r']

  embed2_basic:
    base_name: embed2_basic
    dependencies:
    configs:
      - {tau: 1, zscore: True}
      - {tau: 'ac1e', zscore: True}   # CO_Embed2_Basic(x_z,'ac1e')
    legacy_name: CO_Embed2_Basic
    ordered_args: ['tau']

  embed2_dist:
    base_name: embed2_dist
    dependencies:
    configs:
      - {tau: 'tau', zscore: True, exclude: ['d_expfit_nlogL']}
      - {tau: 1, zscore: True, select: ['d_ac1', 'd_ac3']}   # CO_Embed2_Dist(x_z,1)
    legacy_name: CO_Embed2_Dist
    ordered_args: ['tau']

  embed2_angle_tau:
    base_name: embed2_angle_tau
    dependencies:
    configs:
      - {max_tau: 50, zscore: True}
    legacy_name: CO_Embed2_AngleTau
    ordered_args: ['max_tau']
  
  partial_autocorr:
    base_name: partial_autocorr
    dependencies:
      - statsmodels
    configs:
      - {max_tau: 20, what_method: 'burg', zscore: True}   # CO_PartialAutoCorr(x_z,20,'burg')
    legacy_name: CO_PartialAutoCorr
    ordered_args: ['max_tau', 'what_method']

  nonlinear_autocorr:
    base_name: ac_nl
    dependencies:
    configs:
      - {taus: [[1, 2]], absval: True, zscore: True}
      - {taus: [[1, 2, 3]], absval: False, zscore: True}
      - {taus: [[1, 2, 3, 4]], absval: False, zscore: True}
      - {taus: [[1, 2, 3, 4]], absval: True, zscore: True}
      - {taus: [[1, 2, 3, 4, 5]], absval: False, zscore: True}
      - {taus: [[1, 2, 3, 4, 5, 6]], absval: False, zscore: True}
      - {taus: [[1, 2, 3, 4, 5, 6]], absval: True, zscore: True}
      - {taus: [[1, 2, 3, 4, 5, 6, 7]], absval: False, zscore: True}
      - {taus: [[1, 2, 3, 4, 5, 6, 7, 8]], absval: False, zscore: True}
      - {taus: [[1, 2, 3, 4, 5, 6, 7, 8]], absval: True, zscore: True}

      - {taus: [[1, 3]], absval: False, zscore: True}
      - {taus: [[1, 3]], absval: True, zscore: True}
      - {taus: [[2, 4]], absval: True, zscore: True}

      - {taus: [[1, 3, 5]], absval: False, zscore: True}
      - {taus: [[2, 4, 6]], absval: False, zscore: True}

      - {taus: [[1, 3, 5, 7]], absval: False, zscore: True}
      - {taus: [[1, 3, 5, 7]], absval: True, zscore: True}

      - {taus: [[2, 4, 6, 8]], absval: False, zscore: True}
      - {taus: [[2, 4, 6, 8]], absval: True, zscore: True}
      
      - {taus: [[1, 2, 4]], absval: False, zscore: True}
      - {taus: [[1, 3, 4]], absval: False, zscore: True}

      - {taus: [[1, 4]], absval: False, zscore: True}
      - {taus: [[1, 4]], absval: True, zscore: True}

      - {taus: [[1, 1]], absval: False, zscore: True}
      - {taus: [[1, 1]], absval: True, zscore: True}

      - {taus: [[2, 2]], absval: False, zscore: True}
      - {taus: [[2, 2]], absval: True, zscore: True}

      - {taus: [[3, 3]], absval: False, zscore: True}
      - {taus: [[3, 3]], absval: True, zscore: True}

      - {taus: [[4, 4]], absval: False, zscore: True}
      - {taus: [[4, 4]], absval: True, zscore: True}

      - {taus: [[5, 5]], absval: False, zscore: True}
      - {taus: [[5, 5]], absval: True, zscore: True}

      - {taus: [[6, 6]], absval: False, zscore: True}
      - {taus: [[6, 6]], absval: True, zscore: True}

      - {taus: [[0, 1, 1]], absval: False, zscore: True}
      - {taus: [[0, 2, 2]], absval: False, zscore: True}
      - {taus: [[0, 3, 3]], absval: False, zscore: True}
      - {taus: [[0, 4, 4]], absval: False, zscore: True}
      - {taus: [[0, 5, 5]], absval: False, zscore: True}
      - {taus: [[0, 6, 6]], absval: False, zscore: True}

      - {taus: [[0, 0, 1]], absval: False, zscore: True}
      - {taus: [[0, 0, 2]], absval: False, zscore: True}
      - {taus: [[0, 0, 3]], absval: False, zscore: True}
      - {taus: [[0, 0, 4]], absval: False, zscore: True}
      - {taus: [[0, 0, 5]], absval: False, zscore: True}
      - {taus: [[0, 0, 6]], absval: False, zscore: True}

      - {taus: [[0, 1, 2]], absval: False, zscore: True}
      - {taus: [[0, 1, 3]], absval: False, zscore: True}
      - {taus: [[0, 2, 3]], absval: False, zscore: True}
      - {taus: [[0, 1, 4]], absval: False, zscore: True}
      - {taus: [[0, 2, 4]], absval: False, zscore: True}
      - {taus: [[0, 3, 4]], absval: False, zscore: True}
      - {taus: [[0, 1, 5]], absval: False, zscore: True}
      - {taus: [[0, 2, 5]], absval: False, zscore: True}
      - {taus: [[0, 3, 5]], absval: False, zscore: True}
      - {taus: [[0, 4, 5]], absval: False, zscore: True}
      - {taus: [[0, 1, 6]], absval: False, zscore: True}
      - {taus: [[0, 2, 6]], absval: False, zscore: True}
      - {taus: [[0, 3, 6]], absval: False, zscore: True}
      - {taus: [[0, 4, 6]], absval: False, zscore: True}
      - {taus: [[0, 5, 6]], absval: False, zscore: True}
      - {taus: [[1, 1, 2]], absval: False, zscore: True}
      - {taus: [[1, 1, 3]], absval: False, zscore: True}
      - {taus: [[1, 2, 2]], absval: False, zscore: True}
      - {taus: [[1, 3, 3]], absval: False, zscore: True}
      - {taus: [[2, 2, 3]], absval: False, zscore: True}
      - {taus: [[2, 3, 3]], absval: False, zscore: True}
      - {taus: [[0, 1]], absval: False, zscore: True}   # CO_NonlinearAutocorr(x_z,[0,1],false)
      - {taus: [[0, 1]], absval: True, zscore: True}   # CO_NonlinearAutocorr(x_z,[0,1],true)
      - {taus: [[0, 2]], absval: False, zscore: True}   # CO_NonlinearAutocorr(x_z,[0,2],false)
      - {taus: [[0, 2]], absval: True, zscore: True}   # CO_NonlinearAutocorr(x_z,[0,2],true)
      - {taus: [[0, 3]], absval: False, zscore: True}   # CO_NonlinearAutocorr(x_z,[0,3],false)
      - {taus: [[0, 3]], absval: True, zscore: True}   # CO_NonlinearAutocorr(x_z,[0,3],true)
      - {taus: [[0, 4]], absval: False, zscore: True}   # CO_NonlinearAutocorr(x_z,[0,4],false)
      - {taus: [[0, 4]], absval: True, zscore: True}   # CO_NonlinearAutocorr(x_z,[0,4],true)
      - {taus: [[0, 5]], absval: False, zscore: True}   # CO_NonlinearAutocorr(x_z,[0,5],false)
      - {taus: [[0, 5]], absval: True, zscore: True}   # CO_NonlinearAutocorr(x_z,[0,5],true)
      - {taus: [[0, 6]], absval: False, zscore: True}   # CO_NonlinearAutocorr(x_z,[0,6],false)
      - {taus: [[0, 6]], absval: True, zscore: True}   # CO_NonlinearAutocorr(x_z,[0,6],true)
      - {taus: [[0, 3, 6]], absval: False, zscore: True, preprocess: decimate_ac1e}   # CO_NonlinearAutocorr(zscore(BF_PreProcess(x_z,'decimate_ac1e')),[0,3,6],false)
      - {taus: [[1, 1, 2]], absval: False, zscore: True, preprocess: decimate_ac1e}   # CO_NonlinearAutocorr(zscore(BF_PreProcess(x_z,'decimate_ac1e')),[1,1,2],false)
      - {taus: [[1, 2, 3, 4]], absval: True, zscore: True, preprocess: decimate_ac1e}   # CO_NonlinearAutocorr(zscore(BF_PreProcess(x_z,'decimate_ac1e')),[1,2,3,4],true)
    legacy_name: CO_NonlinearAutocorr
    ordered_args: ['taus', 'absval']
  
  stick_angles:
    base_name: stick_angles
    dependencies:
    configs:
      - {zscore: True}
    legacy_name: CO_StickAngles
    ordered_args:
  
  falling_sticks:
    base_name: falling_sticks
    dependencies:
    configs:
      - {zscore: True, exclude: ['median_all', 'median_n', 'median_p']}
    legacy_name: CO_FallingSticks
    ordered_args:
  
  first_crossing:
    base_name: first_crossing
    dependencies:
    configs:
      - {corr_fun: 'ac', threshold: 0, what_out: 'both', zscore: True}
      - {corr_fun: 'ac', threshold: '1/e', what_out: 'both', zscore: True}
    legacy_name: CO_FirstCrossing
    ordered_args: ['corr_fun', 'threshold', 'what_out']
  
  translate_shape:
    base_name: translate_shape
    dependencies:
    configs:
      - {shape: 'circle', d: 1.5, how_to_move: 'pts', zscore: True, exclude: ['max']}
      - {shape: 'circle', d: 2.5, how_to_move: 'pts', zscore: True, exclude: ['max']}
      - {shape: 'circle', d: 3.5, how_to_move: 'pts', zscore: True, exclude: ['max']}
      - {shape: 'rectangle', d: 2, how_to_move: 'pts', zscore: True, exclude: ['max']}
      - {d: 2.5, zscore: True, preprocess: decimate_ac1e, exclude: ['max']}   # CO_TranslateShape(zscore(BF_PreProcess(x_z,'decimate_ac1e')),'circle',2.5,'pts')
    legacy_name: CO_TranslateShape
    ordered_args: ['shape', 'd', 'how_to_move']
  
  autocorr_shape:
    base_name: autocorr_shape
    configs:
      - {stop_when: 'drown', zscore: True, exclude: ['decayTimescale', 'fexpacf_r2', 'fexpacf_stdres', 'nextrema', 'nmaxima']}
      - {stop_when: 'pos_drown', zscore: True, exclude: ['actau', 'nextrema', 'nmaxima']}   # CO_AutoCorrShape(x_z,'posDrown')
    legacy_name: CO_AutoCorrShape
    ordered_args: ['stop_when']
  
  histogram_ami:
    base_name: histogram_ami
    dependencies:
    configs:
      - {tau: [[1, 2, 3, 4, 5]], meth: 'std1', num_bins: 2, zscore: True, select: ['ami1']}
      - {tau: [[1, 2, 3, 4, 5]], meth: 'std2', num_bins: 2, zscore: True, select: ['ami1', 'ami5']}
      - {tau: [[1, 2, 3, 4, 5]], meth: 'even', num_bins: 2, zscore: True}


    legacy_name: CO_HistogramAMI
    ordered_args: ['tau', 'meth', 'num_bins']

  compare_min_ami:
    base_name: compare_min_ami
    dependencies:
    configs:
      - {bin_method: 'std1', num_bins: [!range [2, 80]], zscore: True, exclude: ['max', 'median', 'mode']}
      - {bin_method: 'std2', num_bins: [!range [2, 80]], zscore: True, select: ['mean', 'min', 'modef', 'nprompeaks', 'std']}
