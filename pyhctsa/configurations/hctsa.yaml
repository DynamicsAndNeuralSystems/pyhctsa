      - {ref: 'max', tau: 'ac', zscore: True, exclude: ['meanpbox10', 'meanpbox5', 'rangepbox10', 'rangepbox5']}
      - {ref: 'max', tau: 1, zscore: True, exclude: ['meanpbox10', 'meanpbox5', 'rangepbox10', 'rangepbox5']}
    ordered_args: ['ref', 'tau']

  delay_time:
