physics:
  force_potential:
    base_name: force_potential
    dependencies:
    configs:
      - {what_potential: 'dblwell', params: [[1, 0.2, 0.1]], zscore: True}
      - {what_potential: 'dblwell', params: [[1, 0.5, 0.2]], zscore: True}
      - {what_potential: 'dblwell', params: [[2, 0.05, 0.2]], zscore: True}
      - {what_potential: 'dblwell', params: [[3, 0.01, 0.1]], zscore: True}

      - {what_potential: 'sine', params: [[3, 0.5, 1]], zscore: True}
      - {what_potential: 'sine', params: [[1, 1, 1]], zscore: True}
      - {what_potential: 'sine', params: [[10, 0.04, 10]], zscore: True}
    legacy_name: PH_ForcePotential
    ordered_args: ['what_potential', 'params']
  
  walker:
    base_name: walker
    dependencies:
    configs:
      - {walker_rule: 'prop', walker_params: 0.1, zscore: True}
      - {walker_rule: 'prop', walker_params: 0.5, zscore: True}
      - {walker_rule: 'prop', walker_params: 0.9, zscore: True}
      - {walker_rule: 'prop', walker_params: 1.1, zscore: True}

      - {walker_rule: 'biasprop', walker_params: [[0.5, 0.1]], zscore: True}
      - {walker_rule: 'biasprop', walker_params: [[0.1, 0.5]], zscore: True}

      - {walker_rule: 'momentum', walker_params: 2, zscore: True}
      - {walker_rule: 'momentum', walker_params: 5, zscore: True}

      - {walker_rule: 'runningvar', walker_params: [[1.5, 50]], zscore: True}
    legacy_name: PH_Walker
    ordered_args: ['walker_rule', 'walker_params']
    