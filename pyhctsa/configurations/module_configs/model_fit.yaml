model_fit:
  ar_cov:
    base_name: ar_cov
    dependencies:
      - statsmodels
    configs:
      - {p: 1, zscore: True}
      - {p: 2, zscore: True}
      - {p: 3, zscore: True}
      - {p: 4, zscore: True}
      - {p: 5, zscore: True}
    legacy_name: MF_AR_arcov
    ordered_args: ['p']

  exp_smoothing:
    base_name: exp_smoothing
    dependencies:
    configs:
      - {n_train: 0.5, alpha: 'best', zscore: True}
    legacy_name: MF_ExpSmoothing
    ordered_args: ['n_train', 'alpha']
  
  ar_fit:
    base_name: ar_fit
    dependencies:
    configs:
      - {p_min: 1, p_max: 8, selector: 'sbc', zscore: True}
    legacy_name: MF_arfit
    ordered_args: ['p_min', 'p_max', 'selector']

  local_simple:
    base_name: local_simple
    dependencies:
    configs:
      - {forecast_meth: 'mean', train_length: 1,    zscore: True}
      - {forecast_meth: 'mean', train_length: 2,    zscore: True}
      - {forecast_meth: 'mean', train_length: 3,    zscore: True}
      - {forecast_meth: 'mean', train_length: 4,    zscore: True}
      - {forecast_meth: 'mean', train_length: 'ac', zscore: True}

      - {forecast_meth: 'median', train_length: 3, zscore: True}
      - {forecast_meth: 'median', train_length: 5, zscore: True}
      - {forecast_meth: 'median', train_length: 7, zscore: True}
      - {forecast_meth: 'median', train_length: 'ac', zscore: True}

      - {forecast_meth: 'lfit', train_length: 2, zscore: True}
      - {forecast_meth: 'lfit', train_length: 3, zscore: True}
      - {forecast_meth: 'lfit', train_length: 4, zscore: True}
      - {forecast_meth: 'lfit', train_length: 5, zscore: True}
      - {forecast_meth: 'lfit', train_length: 'ac', zscore: True}
    legacy_name: FC_LocalSimple
    ordered_args: ['forecast_meth', 'train_length']
  
  loop_local_simple:
    base_name: loop_local_simple
    dependencies:
    configs:
      - {forecast_meth: 'mean', zscore: True}
    legacy_name: FC_LoopLocalSimple
    ordered_args: ['forecast_meth']
  
  fit_subsegments:
    base_name: fit_subsegments
    dependencies:
      - statsmodels
    configs:
      - {model: 'ar', order: 2, subset_how: 'uniform', sample_p: [[25, 0.1]], zscore: True}
    legacy_name: MF_FitSubsegments
    ordered_args: ['model', 'order', 'subset_how', 'sample_p']
  
  hmm_fit:
    base_name: hmm_fit
    dependencies:
      - hmmlearn
    configs:
      - {train_p: 0.7, num_states: 3, zscore: True}
      - {train_p: 0.7, num_states: 2, zscore: True}
      - {train_p: 0.8, num_states: 3, zscore: True}
      - {train_p: 0.8, num_states: 2, zscore: True}
    legacy_name: MF_hmm_fit
    ordered_args: ['train_p', 'num_states']
    