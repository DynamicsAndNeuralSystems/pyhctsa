    depedencies:
    configs:
      - {zscore: True}
    legacy_name: DK_crinkle
    ordered_args:
  
  theiler_q:
    base_name: theiler_q
    depedencies:
    configs:
      - {zscore: True}
    legacy_name: DK_theilerQ
    ordered_args:
